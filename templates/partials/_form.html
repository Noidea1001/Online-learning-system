{# templates/partials/_form.html #}
<form method="post" class="mt-3 form" {% if enctype %}enctype="{{ enctype }}"{% endif %}>
  {% csrf_token %}
  {{ form.as_p }}
  {% block extra_form %}{% endblock %}
  <button type="submit" class="btn btn-primary">Save</button>
  {% if cancel_url %}<a href="{{ cancel_url }}" class="btn btn-link">Cancel</a>{% endif %}
</form>
