{% extends "base.html" %}

{% block title %}Bad Request — Online Learning System{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="d-flex flex-column align-items-center text-center mx-auto" style="max-width: 480px;">

    <div class="mb-4 d-flex align-items-center justify-content-center"
         style="width: 96px; height: 96px; border-radius: var(--radius-2xl); background: rgba(183, 121, 31, 0.10);">
      <i class="bi bi-exclamation-triangle text-warning" style="font-size: 2.75rem;"></i>
    </div>

    <div class="fw-bold" style="font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1; color: var(--text); letter-spacing: -0.03em;">
      400
    </div>

    <h1 class="mt-3 mb-2">Bad Request</h1>
    <p class="text-muted mb-4">
      The request couldn't be understood — a link may be broken or malformed. Try going back and trying again.
    </p>

    <div class="d-flex flex-wrap justify-content-center gap-2">
      <a href="{% url 'dashboard_home' %}" class="btn btn-primary rounded-pill px-4 fw-semibold">
        <i class="bi bi-house-door me-1"></i> Back to Dashboard
      </a>
    </div>

  </div>
</div>
{% endblock %}
