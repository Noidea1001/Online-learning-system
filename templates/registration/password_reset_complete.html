{# templates/registration/password_reset_complete.html #}
{% extends "base.html" %}
{% block title %}Password reset complete{% endblock %}
{% block content %}
<div class="container" style="max-width: 420px">
  <h2 class="mb-3">Password reset complete</h2>
  <p>Your password has been set. You can now sign in with your new credentials.</p>
  <p class="mt-3"><a href="{% url 'login' %}" class="btn btn-primary w-100">Sign in</a></p>
</div>
{% endblock %}
