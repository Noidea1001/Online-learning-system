
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1E33" />
  <title>Something Went Wrong — Online Learning System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F6F7F9;
      color: #1C1F26;
      text-align: center;
    }
    .card { max-width: 400px; }
    .code {
      font-weight: 800;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.03em;
      color: #C53030;
      margin-bottom: 12px;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: #0B1E33;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 34px; height: 34px; }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0 0 8px;
    }
    p {
      color: #5A6170;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button, a.btn {
      appearance: none;
      border: none;
      text-decoration: none;
      display: inline-block;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
    }
    button {
      background: #1E5AA8;
      color: #fff;
    }
    button:active { opacity: 0.85; }
    a.btn {
      background: transparent;
      color: #1C1F26;
      border: 1px solid #DDE1E8;
      padding: 11px 27px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v4" />
        <path d="M12 17h.01" />
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
      </svg>
    </div>
    <div class="code">500</div>
    <h1>Something went wrong</h1>
    <p>An unexpected error occurred on our end. It's already been logged — please try again in a moment.</p>
    <div class="actions">
      <button onclick="window.location.reload()">Try Again</button>
      <a class="btn" href="/">Go to Homepage</a>
    </div>
  </div>
</body>
</html>
