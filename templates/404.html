{% extends "base.html" %}

{% block title %}Page Not Found — Online Learning System{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="d-flex flex-column align-items-center text-center mx-auto" style="max-width: 480px;">

    <div class="mb-4 d-flex align-items-center justify-content-center"
         style="width: 96px; height: 96px; border-radius: var(--radius-2xl); background: var(--primary-light);">
      <i class="bi bi-signpost-2 text-primary" style="font-size: 2.75rem;"></i>
    </div>

    <div class="fw-bold" style="font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1; color: var(--text); letter-spacing: -0.03em;">
      404
    </div>

    <h1 class="mt-3 mb-2">Page Not Found</h1>
    <p class="text-muted mb-4">
      The page you're looking for doesn't exist, may have been moved, or you may have mistyped the address.
    </p>

    <div class="d-flex flex-wrap justify-content-center gap-2">
      <a href="{% url 'dashboard_home' %}" class="btn btn-primary rounded-pill px-4 fw-semibold">
        <i class="bi bi-house-door me-1"></i> Back to Dashboard
      </a>
      <a href="{% url 'course_list' %}" class="btn btn-outline-secondary rounded-pill px-4 fw-semibold">
        <i class="bi bi-search me-1"></i> Browse Courses
      </a>
    </div>

  </div>
</div>
{% endblock %}
