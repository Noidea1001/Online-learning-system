{# templates/offline.html — intentionally standalone, no CDN/static dependencies #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1E33" />
  <title>You're Offline — Online Learning System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F6F7F9;
      color: #1C1F26;
      text-align: center;
    }
    .card {
      max-width: 380px;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: #0B1E33;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 34px; height: 34px; }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0 0 8px;
    }
    p {
      color: #5A6170;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    button {
      appearance: none;
      border: none;
      background: #1E5AA8;
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <path d="M12 20h.01" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>This page needs an internet connection. Check your connection and try again — anything already opened may still be cached.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
